# One-command run:  docker compose up --build
#   dashboard -> http://localhost:3000
#   API       -> http://localhost:8000/docs
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
