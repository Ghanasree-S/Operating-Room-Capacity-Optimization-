target-version = "py310"
line-length = 100
extend-exclude = ["legacy_excel"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long string literals are left to the formatter's judgement.
ignore = ["E501"]

[lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]
